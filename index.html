<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Desk Assembly</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">Loading 3D Engine...</div>

    <div id="ui">
        <h1>DESK ASSEMBLER</h1>
        <p>Drag the legs into the flashing sockets</p>
    </div>

    <div id="success-msg">
        <h2>✨ Great Job! ✨</h2>
        <p>Your desk is ready.</p>
        <button onclick="location.reload()">Assemble Another</button>
    </div>

    <div id="canvas-container"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
